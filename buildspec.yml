version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install -r requirements-dev.txt
  build:
    commands:
      - python -m unittest discover -s tests -v
      - python scripts/check_project.py
artifacts:
  files:
    - cloudformation/template.yaml
    - glue/transform_telemetry.py
# Starter CodeBuild check, not an automatically deployed CodePipeline.
